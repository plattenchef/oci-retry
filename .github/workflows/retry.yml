name: retry
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
concurrency: retry
permissions:
  actions: write
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OCI_USER: ${{ secrets.OCI_USER }}
      OCI_FP: ${{ secrets.OCI_FP }}
      OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
      OCI_KEY: ${{ secrets.OCI_KEY }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SUPPRESS_LABEL_WARNING: "True"
    steps:
      - name: run
        run: |
          set +e
          pip install -q oci-cli
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_KEY" > ~/.oci/key.pem
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=eu-marseille-1\nkey_file=%s\n' "$OCI_USER" "$OCI_FP" "$OCI_TENANCY" "$HOME/.oci/key.pem" > ~/.oci/config
          chmod 600 ~/.oci/key.pem ~/.oci/config
          C=$OCI_TENANCY
          EX=$(oci compute instance list --compartment-id "$C" --display-name mc-rescue --query 'data[?"lifecycle-state"!=`TERMINATED`]|[0].id' --raw-output 2>&1)
          echo "EX=$EX"
          if echo "$EX" | grep -q "ocid1.instance"; then gh workflow disable retry.yml; exit 0; fi
          AD=$(oci iam availability-domain list --compartment-id "$C" --query 'data[0].name' --raw-output 2>&1)
          echo "AD=$AD"
          BV=$(oci bv boot-volume list --compartment-id "$C" --availability-domain "$AD" --query 'data[0].id' --raw-output 2>&1)
          echo "BV=$BV"
          SN=$(oci network subnet list --compartment-id "$C" --query 'data[?"prohibit-public-ip-on-vnic"==`false`]|[0].id' --raw-output 2>&1)
          echo "SN=$SN"
          if ! echo "$BV" | grep -q "ocid1.bootvolume" || ! echo "$SN" | grep -q "ocid1.subnet"; then echo "FEHLER: BV oder SN ungueltig"; exit 1; fi
          OUT=$(oci --no-retry compute instance launch --compartment-id "$C" --availability-domain "$AD" --subnet-id "$SN" --assign-public-ip true --source-boot-volume-id "$BV" --display-name mc-rescue --shape VM.Standard.A1.Flex --shape-config '{"ocpus":1,"memoryInGBs":1}' 2>&1)
          echo "$OUT"
          if echo "$OUT" | grep -q PROVISIONING; then gh workflow disable retry.yml; fi
